-rest{display:grid;gap:4px;font-size:11px;color:var(--ws-muted)}#workout-set-slots select{font:12px/1.5 system-ui,sans-serif;color:var(--ws-text);background:var(--ws-bg);padding:7px;border:1px solid var(--ws-line);border-radius:7px;min-height:36px}#workout-set-slots .ws-track{height:3px;background:var(--ws-line);border-radius:3px;overflow:hidden}#workout-set-slots .ws-track span{display:block;height:100%;background:var(--ws-accent)}
#workout-set-slots .ws-focus-top{display:flex;justify-content:space-between;align-items:start;gap:12px}#workout-set-slots .ws-focus-fields{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px}#workout-set-slots .ws-focus-fields label{display:grid;gap:6px;color:var(--ws-muted);font-size:12px}#workout-set-slots .ws-focus-fields input{font-size:35px;min-height:74px;text-align:center}#workout-set-slots .ws-set-pills{display:grid;grid-template-columns:1fr 1fr;gap:7px}#workout-set-slots .ws-set-pills button{display:grid;gap:4px;text-align:left;font-size:12px;padding:10px;background:var(--ws-bg)}#workout-set-slots .ws-set-pills b{font-size:15px}#workout-set-slots .ws-focus-compare{display:grid;gap:5px;padding:0 0 7px;border-bottom:1px solid var(--ws-line)}
#workout-set-slots .ws-compare{display:grid;gap:13px}#workout-set-slots .ws-compare-row{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:14px;align-items:start;border-top:1px solid var(--ws-line);padding-top:12px}#workout-set-slots .ws-compare-row.ws-active{border-color:var(--ws-accent)}#workout-set-slots .ws-previous-values{display:grid;gap:6px}#workout-set-slots .ws-previous-values b{font-size:20px;font-weight:500}#workout-set-slots .ws-today-pair{display:grid;grid-template-columns:1.1fr .9fr;gap:7px}#workout-set-slots .ws-today-pair label{display:grid;gap:5px;font-size:11px;color:var(--ws-muted)}#workout-set-slots .ws-today-pair input{font-size:17px;padding:9px 7px}#workout-set-slots .ws-compare-delta{font-size:11px;color:var(--ws-muted);margin-top:8px!important}#workout-set-slots .ws-compare-row button{min-height:28px;font-size:11px;padding:3px 7px;margin-top:5px}
#workout-set-slots .ws-progress{display:grid;gap:10px}#workout-set-slots summary{color:var(--ws-text);font-size:12px;min-height:32px}#workout-set-slots .ws-history-table{width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums}#workout-set-slots .ws-history-table th{text-align:left;font-weight:500;color:var(--ws-muted);padding:7px 2px}#workout-set-slots .ws-history-table td{padding:8px 2px;border-top:1px solid var(--ws-line)}#workout-set-slots .ws-remember{font-size:12px;display:grid;gap:7px;margin-top:7px}#workout-set-slots .ws-remember-line{display:flex;justify-content:space-between;gap:9px}#workout-set-slots .ws-memory-note{color:var(--ws-muted);font-size:11px;margin-top:8px!important}#workout-set-slots .ws-notice{font-size:11px;color:var(--ws-muted);min-height:34px}#workout-set-slots .ws-next-workout{width:100%;font-size:12px}#workout-set-slots .ws-nav{display:flex;justify-content:space-around;padding:14px;border-top:1px solid var(--ws-line);color:var(--ws-muted);font-size:11px}#workout-set-slots .ws-nav span{display:grid;gap:4px;justify-items:center}#workout-set-slots .ws-nav .ws-current{color:var(--ws-accent)}

<div id="workout-set-slots" class="viz-carousel viz-dotted-background" aria-label="Remember each workout set">
  <section class="ws-stage" data-variant="Pair ledger" data-layout="ledger" aria-label="Pair ledger workout layout"><div class="ws-phone" data-day="A"></div></section>
  <section class="ws-stage" data-variant="Focus set" data-layout="focus" aria-label="Focus set workout layout" hidden><div class="ws-phone" data-day="A"></div></section>
  <section class="ws-stage" data-variant="Compare grid" data-layout="compare" aria-label="Compare grid workout layout" hidden><div class="ws-phone" data-day="A"></div></section>
</div>
<script>
(() => {
  const root = document.getElementById('workout-set-slots');
  const copy = value => JSON.parse(JSON.stringify(value));
  const defaults = [{weight:22.5,reps:12},{weight:25,reps:8}];
  const days = {
    A:[{name:'啞鈴臥推 (Bench)',short:'Dumbbell bench press',angle:0,rest:90},{name:'哥布林深蹲 (Squat)',short:'Goblet squat',angle:null,rest:90,sets:[{weight:24,reps:12},{weight:26,reps:8}]}],
    B:[{name:'上斜啞鈴臥推 (Incline)',short:'Incline bench press',angle:30,rest:90},{name:'單臂啞鈴划船 (Row)',short:'Single-arm row',angle:30,rest:90,sets:[{weight:16,reps:12},{weight:18,reps:8}]}],
    C:[{name:'啞鈴肩推 (Shoulder)',short:'Dumbbell shoulder press',angle:75,rest:60,sets:[{weight:10,reps:12},{weight:12,reps:8}]},{name:'上斜彎舉 (Curl)',short:'Incline curl',angle:45,rest:60,sets:[{weight:8,reps:12},{weight:10,reps:8}]}]
  };
  const pair = s => s ? `${s.weight} kg × ${s.reps}` : 'Not recorded';
  const angle = e => e.angle === null ? 'Angle not set' : `${e.angle}° bench angle`;
  const clock = n => `${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;
  const esc = value => String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const initial = () => ({day:'A',index:0,previewSet:0,round:1,showProgress:true,notice:'Complete a set to remember that pair for next time.',exercises:Object.fromEntries(Object.entries(days).map(([d,list])=>[d,list.map(e=>({remembered:copy(e.sets||defaults),last:copy(e.sets||defaults),baseline:copy(e.sets||defaults),lastDate:'Nov 14',drafts:copy(e.sets||defaults),logs:[null,null],prior:[null,null],rest:e.rest,remaining:e.rest,phase:'idle',deadline:null}))]))});
  const states = new Map();
  const saved = window.openai?.widgetState;
  for (const section of root.querySelectorAll('[data-layout]')) {
    const s = initial();
    const stored = saved?.privateContent?.layouts?.[section.dataset.layout];
    if (stored && ['A','B','C'].includes(stored.day) && stored.exercises) Object.assign(s, stored);
    states.set(section,s);
  }
  function rememberState() {
    const layouts = {};
    for (const [section,s] of states) layouts[section.dataset.layout] = s;
    const visible = [...states].find(([section])=>!section.hidden);
    const [section,s] = visible || [...states][0];
    const e = s.exercises[s.day][s.index];
    window.openai?.setWidgetState?.({modelContent:{prototype:'Per-set weight and reps',variant:section.dataset.variant,day:s.day,exercise:days[s.day][s.index].short,rememberedPairs:e.remembered,completedSets:e.logs.filter(Boolean).length},privateContent:{layouts}})?.catch(()=>{});
  }
  function next(e){return e.logs.findIndex(l=>!l)}
  function delta(value, old, label) {const n=value-old;return n===0?`same ${label==='kg'?'weight':label}`:`${n>0?'+':''}${n} ${label}`}
  function comparison(e,i) {const v=e.logs[i]||e.drafts[i];if(!e.last[i])return 'No matching set recorded last time';return `${e.logs[i]?'Recorded':'Planned'} · ${delta(v.weight,e.last[i].weight,'kg')} · ${delta(v.reps,e.last[i].reps,'reps')}`}
  function field(e,i,key,mode='') {return `<input type="number" data-slot="${i}" data-field="${key}" min="${key==='weight'?0:1}" max="${key==='weight'?1000:300}" step="${key==='weight'?'.5':'1'}" required aria-label="Set ${i+1} ${key==='weight'?'weight in kg':'reps'}" value="${(e.logs[i]||e.drafts[i])[key]}" ${e.logs[i]?'readonly':''} ${mode}>`}
  function undo(e,i) {return e.logs[i]?`<button type="button" data-undo="${i}" aria-label="Undo set ${i+1}">Undo</button>`:''}
  function ledger(e) {
    return `<div><div class="ws-grid-head"><span>Set</span><span>Weight · kg</span><span>Reps</span></div>${e.drafts.map((_,i)=>`<div class="ws-set-row ${i===next(e)?'ws-active':''}"><span class="ws-number"><b>${i+1}</b>${e.logs[i]?' ✓':''}</span>${field(e,i,'weight')}${field(e,i,'reps')}</div><div class="ws-last-inline"><span data-comparison="${i}">Last: ${pair(e.last[i])} · ${comparison(e,i)}</span>${undo(e,i)}</div>`).join('')}</div>`;
  }
  function focus(e,s) {
    const i=Math.min(1,s.previewSet);
    return `<div class="ws-set-pills">${e.drafts.map((_,j)=>`<button type="button" data-set-focus="${j}" aria-pressed="${i===j}"><span>Set ${j+1}${e.logs[j]?' · Recorded':j===next(e)?' · Up now':' · Up next'}</span><b>${pair(e.logs[j]||e.drafts[j])}</b></button>`).join('')}</div><div class="ws-focus-top"><span class="ws-eyebrow">${e.logs[i]?'Recorded':'Editing'} set ${i+1} of 2</span>${undo(e,i)}</div><div class="ws-focus-fields"><label>Weight · kg${field(e,i,'weight')}</label><label>Reps${field(e,i,'reps')}</label></div><div class="ws-focus-compare"><span class="ws-small ws-muted">Last time · set ${i+1}</span><strong>${pair(e.last[i])}</strong><span class="ws-small ws-muted" data-comparison="${i}">${comparison(e,i)}</span></div>`;
  }
  function compare(e) {
    return `<div class="ws-heading ws-eyebrow"><span>Last time · ${e.lastDate}</span><span>Today</span></div><div class="ws-compare">${e.drafts.map((_,i)=>`<div class="ws-compare-row ${i===next(e)?'ws-active':''}"><div class="ws-previous-values"><span class="ws-small ws-muted">Set ${i+1}${e.logs[i]?' ✓':''}</span><b>${e.last[i]?`${e.last[i].weight} <small>kg</small>`:'—'}</b><span class="ws-small ws-muted">${e.last[i]?`${e.last[i].reps} reps`:'Not recorded'}</span>${undo(e,i)}</div><div><div class="ws-today-pair"><label>kg${field(e,i,'weight')}</label><label>reps${field(e,i,'reps')}</label></div><p class="ws-compare-delta" data-comparison="${i}">${comparison(e,i)}</p></div></div>`).join('')}</div>`;
  }
  function history(e,s) {
    const today = e.logs.some(Boolean);
    return `<details class="ws-progress"><summary>Exercise progress · compare each set</summary><table class="ws-history-table"><thead><tr><th>Workout</th><th>Set 1 · kg × reps</th><th>Set 2 · kg × reps</th></tr></thead><tbody><tr><td>Nov 10</td>${e.baseline.map(v=>`<td>${Math.max(0,v.weight-2.5)} × ${v.reps}</td>`).join('')}</tr><tr><td>${e.lastDate}</td>${e.last.map(v=>`<td>${v?`${v.weight} × ${v.reps}`:'Not recorded'}</td>`).join('')}</tr>${today?`<tr><td>This workout</td>${e.logs.map(v=>`<td>${v?`${v.weight} × ${v.reps}`:'Not recorded'}</td>`).join('')}</tr>`:''}</tbody></table></details>`;
  }
  function memory(e) {
    return `<details class="ws-memory"><summary>Remembered for next time</summary><div class="ws-remember">${e.remembered.map((v,i)=>`<div class="ws-remember-line"><span>Set ${i+1}</span><strong>${pair(v)}</strong></div>`).join('')}</div><p class="ws-memory-note">Only completed sets update these pairs. Unfinished edits stay in today’s workout.</p></details>`;
  }
  function render(section) {
    const s=states.get(section),e=s.exercises[s.day][s.index],config=days[s.day][s.index],phone=section.querySelector('.ws-phone');
    const openMemory=!!phone.querySelector('.ws-memory[open]'),openProgress=!!phone.querySelector('.ws-progress[open]');
    const targetSet=section.dataset.layout==='focus'&&!e.logs[s.previewSet]?s.previewSet:next(e);
    const action=e.phase==='running'?'Pause rest':e.phase==='paused'?'Resume rest':next(e)<0?'Both sets recorded':`Complete set ${targetSet+1} & rest`;
    const peek=delta=>{const j=s.index+delta,c=days[s.day][j],p=s.exercises[s.day][j];return `<button type="button" data-exercise="${j}" ${c?'':'disabled'}><small>${delta<0?'← Previous':'Up next →'}</small><b>${c?esc(c.short):delta<0?'Start of workout':'End of workout'}</b><span>${c?pair(p.drafts[Math.max(0,next(p))]):'—'}</span><small>${c?angle(c):' '}</small></button>`};
    phone.dataset.day=s.day;
    phone.innerHTML=`<header class="ws-header"><div class="ws-brand"><i data-lucide="activity" aria-hidden="true"></i>FORM</div><span class="ws-tag">Prototype · ${esc(section.dataset.variant)}</span></header><main class="ws-body"><div class="ws-days" role="group" aria-label="Workout day">${['A','B','C'].map(d=>`<button type="button" data-day="${d}" aria-pressed="${s.day===d}">Day ${d}</button>`).join('')}</div><div class="ws-heading"><div><span class="ws-eyebrow">${s.round===1?'Today’s focus':'Next workout preview'}</span><p>Strength & stability</p></div><span class="ws-small ws-muted">${s.index+1} / 2</span></div><nav class="ws-peek" aria-label="Exercise navigation">${peek(-1)}${peek(1)}</nav><article class="ws-exercise"><div class="ws-exercise-title"><div class="ws-plan-title"><span class="ws-eyebrow">Exercise ${String(s.index+1).padStart(2,'0')}</span><span class="ws-status-pill">${e.logs.filter(Boolean).length} / 2 sets</span></div><h2>${esc(config.name)}</h2><p class="ws-small ws-muted">${angle(config)} · Two individual set targets</p></div>${section.dataset.layout==='ledger'?ledger(e):section.dataset.layout==='focus'?focus(e,s):compare(e)}<button type="button" class="ws-primary" data-complete ${next(e)<0&&e.phase!=='running'&&e.phase!=='paused'?'disabled':''}>${action}</button><div class="ws-timer"><div><span class="ws-eyebrow" data-phase>${e.phase==='running'?'Resting':e.phase==='paused'?'Paused':e.phase==='ready'?'Ready':'Rest after each set'}</span><div class="ws-clock" role="timer" data-clock>${clock(e.remaining)}</div></div><label class="ws-rest">Default rest<select data-rest aria-label="Default rest time">${[30,60,90,120].map(n=>`<option value="${n}" ${n===e.rest?'selected':''}>${clock(n)}</option>`).join('')}</select></label></div><div class="ws-track"><span data-track style="width:${Math.max(0,Math.min(100,e.remaining/e.rest*100))}%"></span></div></article>${history(e,s)}${memory(e)}<p class="ws-notice" aria-live="polite">${esc(s.notice)}</p><button type="button" class="ws-next-workout" data-new>Finish & preview next workout →</button></main><nav class="ws-nav" aria-label="App navigation preview"><span class="ws-current"><i data-lucide="dumbbell" aria-hidden="true"></i>Train</span><span><i data-lucide="calendar-days" aria-hidden="true"></i>Calendar</span><span><i data-lucide="chart-no-axes-combined" aria-hidden="true"></i>Insights</span></nav>`;
    if(openMemory)phone.querySelector('.ws-memory').open=true;if(openProgress)phone.querySelector('.ws-progress').open=true;phone.querySelector('.ws-progress').hidden=!s.showProgress;
    globalThis.lucide?.createIcons({attrs:{width:16,height:16}});
  }
  for(const section of states.keys())render(section);
  root.addEventListener('input',event=>{
    const field=event.target;if(!field.matches('[data-slot]')||!field.validity.valid)return;
    const section=field.closest('[data-layout]'),s=states.get(section),e=s.exercises[s.day][s.index],i=Number(field.dataset.slot);
    if(e.logs[i])return;
    e.drafts[i][field.dataset.field]=Number(field.value);
    // Keep the focused field stable while typing and update only adjacent summaries.
    for(const item of section.querySelectorAll('[data-comparison]')){const j=Number(item.dataset.comparison);item.textContent=section.dataset.layout==='ledger'?`Last: ${pair(e.last[j])} · ${comparison(e,j)}`:comparison(e,j);}
    for(const item of section.querySelectorAll('[data-set-focus]')){const j=Number(item.dataset.setFocus);item.querySelector('b').textContent=pair(e.logs[j]||e.drafts[j]);}
    rememberState();
  });
  root.addEventListener('change',event=>{
    const section=event.target.closest('[data-layout]');if(!section)return;
    const s=states.get(section),e=s.exercises[s.day][s.index];
    if(event.target.matches('[data-rest]')){e.rest=Number(event.target.value);if(e.phase==='idle')e.remaining=e.rest;}
    if(event.target.matches('[data-rest]')){render(section);rememberState();}
  });
  root.addEventListener('click',event=>{
    const b=event.target.closest('button');if(!b||b.disabled)return;
    const section=b.closest('[data-layout]');if(!section)return;
    const s=states.get(section),e=s.exercises[s.day][s.index];
    if(b.dataset.day){s.day=b.dataset.day;s.index=0;s.previewSet=0;}
    else if(b.dataset.exercise!==undefined){s.index=Number(b.dataset.exercise);s.previewSet=Math.max(0,next(s.exercises[s.day][s.index]));}
    else if(b.dataset.setFocus!==undefined)s.previewSet=Number(b.dataset.setFocus);
    else if(b.dataset.undo!==undefined){const i=Number(b.dataset.undo);e.remembered[i]=copy(e.prior[i]);e.logs[i]=null;e.phase='idle';e.remaining=e.rest;e.deadline=null;s.previewSet=i;s.notice=`Set ${i+1} undone. Its previous remembered pair is restored.`;}
    else if(b.hasAttribute('data-complete')){
      if(e.phase==='running'){e.phase='paused';e.deadline=null;}
      else if(e.phase==='paused'){e.phase='running';e.deadline=Date.now()+e.remaining*1000;}
      else {const i=section.dataset.layout==='focus'&&!e.logs[s.previewSet]?s.previewSet:next(e);if(i<0)return;for(const field of section.querySelectorAll(`[data-slot="${i}"]`))if(!field.reportValidity())return;e.prior[i]=copy(e.remembered[i]);e.logs[i]=copy(e.drafts[i]);e.remembered[i]=copy(e.logs[i]);e.phase='running';e.remaining=e.rest;e.deadline=Date.now()+e.rest*1000;s.previewSet=Math.max(i,next(e));s.notice=`Set ${i+1} recorded: ${pair(e.logs[i])}. That pair is remembered for next time.`;}
    }
    else if(b.hasAttribute('data-new')){for(const day of Object.values(s.exercises))for(const item of day){if(item.logs.some(Boolean)){item.last=copy(item.logs);item.lastDate='Previous workout';}item.drafts=copy(item.remembered);item.logs=[null,null];item.prior=[null,null];item.phase='idle';item.remaining=item.rest;item.deadline=null;}s.round++;s.previewSet=0;s.notice='Next workout loaded: each completed set kept its own weight and reps. Unfinished edits were not carried over.';}
    else return;
    render(section);rememberState();
  });
  setInterval(()=>{for(const[section,s]of states){const e=s.exercises[s.day][s.index];for(const day of Object.values(s.exercises))for(const item of day)if(item.phase==='running'){item.remaining=Math.max(0,Math.ceil((item.deadline-Date.now())/1000));if(item.remaining===0){item.phase='ready';item.deadline=null;if(item===e)render(section);}}section.querySelector('[data-clock]').textContent=clock(e.remaining);section.querySelector('[data-track]').style.width=`${Math.max(0,Math.min(100,e.remaining/e.rest*100))}%`; }},250);
  window.addEventListener('openai:set_globals',event=>{const stored=event.detail?.globals?.widgetState?.privateContent?.layouts;if(!stored)return;for(const[section,s]of states){const next=stored[section.dataset.layout];if(next&&next.exercises&&['A','B','C'].includes(next.day)){Object.assign(s,next);render(section);}}});
  if(globalThis.Tweak)for(const section of states.keys()){
    const options=states.get(section);const tweak=new Tweak({container:section.querySelector('.ws-phone'),onChange:()=>render(section)});tweak.addToggle(options,'showProgress',{label:'Show exercise progress'});
  }
})();
</script>
